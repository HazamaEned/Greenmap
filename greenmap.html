<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenMap</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h1 class="logo">🌿 GreenMap</h1>

        <ul class="menu">
            <li>Dashboard</li>
            <li>Map</li>
            <li>Species Lookup</li>
            <li>Add Tree</li>
            <li>My Contributions</li>
            <li>Settings</li>
        </ul>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- Top bar -->
        <div class="topbar">
            <span>Welcome, User</span>
            <span>Welcome, User</span>
            <button class="issue-btn">Report an Issue</button>
        </div>

        <!-- Map area -->
        <div class="map-area" id="map-area">
            <div id="map"></div>

            <div class="tree-popup hidden">
                <img id="tree-img" src="tree.jpg" alt="Tree">
                <div class="info">
                    <h3 id="tree-name">Tree Details</h3>
                    <p id="tree-species">Species: -</p>
                    <p id="tree-planted">Planted: -</p>
                    <p id="tree-addedby">Added By: -</p>
                    <button id="view-more">View More</button>
                    <button id="close-tree-popup">Close</button>
                </div>
            </div>

            <div class="gps-status">
                <span>📡 GPS Status: Active</span>
            </div>

        </div>

        <!-- Dynamic panel -->
        <div id="panel" class="panel hidden"></div>

    </main>

</div>


<script>
$(document).ready(function() {

    var mapInitialized = false;
    var map = null;

    function initMap() {
        if (mapInitialized) return;
        if (!document.getElementById('map')) return;

        // Default center: Pasig, Philippines
        map = L.map('map').setView([14.5764, 121.0851], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Sample trees around Pasig — replace or extend with real data later
        var trees = [
            {id:1, name: 'Mango Tree', species: 'Mangifera indica', lat:14.5769, lon:121.0848, planted:2012, addedBy:'UserA', img:'tree.jpg'},
            {id:2, name: 'Acacia', species: 'Acacia mangium', lat:14.5758, lon:121.0860, planted:2015, addedBy:'UserB', img:'tree.jpg'},
            {id:3, name: 'Narra', species: 'Pterocarpus indicus', lat:14.5771, lon:121.0868, planted:2008, addedBy:'UserC', img:'tree.jpg'},
            {id:4, name: 'Bamboo Cluster', species: 'Bambusoideae', lat:14.5780, lon:121.0835, planted:2019, addedBy:'UserD', img:'tree.jpg'},
            {id:5, name: 'Acacia 2', species: 'Acacia mangium', lat:14.5745, lon:121.0855, planted:2014, addedBy:'UserE', img:'tree.jpg'},
            {id:6, name: 'Guyabano', species: 'Annona muricata', lat:14.5760, lon:121.0830, planted:2017, addedBy:'UserF', img:'tree.jpg'},
            {id:7, name: 'Tamarind', species: 'Tamarindus indica', lat:14.5750, lon:121.0872, planted:2010, addedBy:'UserG', img:'tree.jpg'},
            {id:8, name: 'Mango 2', species: 'Mangifera indica', lat:14.5778, lon:121.0842, planted:2013, addedBy:'UserH', img:'tree.jpg'},
            {id:9, name: 'Molave', species: 'Vitex parviflora', lat:14.5785, lon:121.0859, planted:2005, addedBy:'UserI', img:'tree.jpg'},
            {id:10, name: 'Banaba', species: 'Lagerstroemia speciosa', lat:14.5753, lon:121.0838, planted:2011, addedBy:'UserJ', img:'tree.jpg'}
        ];

        trees.forEach(function(t){
            var marker = L.marker([t.lat, t.lon]).addTo(map);
            var popupHtml = '<div style="min-width:150px"><strong>' + t.name + '</strong><br>' + t.species + '<br>Planted: ' + t.planted + '<br>Added By: ' + t.addedBy + '</div>';
            marker.bindPopup(popupHtml);
        });

        mapInitialized = true;
    }

    function hideMap() {
        $("#map-area").hide();
        $("#panel").removeClass("hidden");
    }

    function showMap() {
        $("#map-area").show();
        $("#panel").addClass("hidden");
        initMap();
        setTimeout(function(){ if (map) map.invalidateSize(); }, 200);
    }

    // Initialize map now if map area is visible
    initMap();
    setTimeout(function(){ if (map) map.invalidateSize(); }, 200);

    // Set Map as active by default on page load
    $(".menu li:contains('Map')").addClass("active");

    // Close button for the tree popup panel
    $(document).on('click', '#close-tree-popup', function(){
        $('.tree-popup').addClass('hidden');
    });

    // Sidebar click handlers
    $(".menu li").click(function() {
        // Remove active class from all menu items
        $(".menu li").removeClass("active");
        // Add active class to clicked item
        $(this).addClass("active");
        
        let option = $(this).text();

        // Dashboard
        if (option === "Dashboard") {
            hideMap();
            $("#panel").load("pages/dashboard.html");
        }

        // Map
        if (option === "Map") {
            showMap();
        }

        // Species Lookup
        if (option === "Species Lookup") {
            hideMap();
            $("#panel").load("pages/species.html");
        }

        // Add Tree
        if (option === "Add Tree") {
            hideMap();
            $("#panel").load("pages/add-tree.html");
        }

        // My Contributions
        if (option === "My Contributions") {
            hideMap();
            $("#panel").load("pages/contributions.html");
        }

        // Settings
        if (option === "Settings") {
            hideMap();
            $("#panel").load("pages/settings.html");
        }
    });

});
</script>



</body>
</html>
