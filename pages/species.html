<section class="view-stack">
    <header class="panel-header">
        <span>Reference</span>
        <h2>Species Lookup</h2>
    </header>

    <div class="search-row">
        <input type="text" id="species-search" placeholder="Search species">
        <select id="species-status-filter">
            <option value="">All Status</option>
        </select>
        <select id="species-location-filter">
            <option value="">All Locations</option>
        </select>
        <button id="search-btn">Search</button>
    </div>
    <p id="species-count" class="result-count" aria-live="polite"></p>

    <div class="card-grid" id="species-card-grid">
        <!-- Cards are now rendered dynamically from the speciesData array in app.js -->
    </div>
</section>
