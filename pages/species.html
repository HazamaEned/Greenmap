<section class="view-stack">
    <header class="panel-header">
        <span>Reference</span>
        <h2>Species Lookup</h2>
    </header>

    <div class="search-row">
        <input type="text" id="species-search" placeholder="Search species">
        <button id="search-btn">Search</button>
    </div>
    <p id="species-count" class="result-count" aria-live="polite"></p>

    <div class="card-grid">
        <article class="card">
            <img src="trees/narra.jpg" alt="Narra">
            <h3>Narra</h3>
            <small>Pterocarpus indicus</small>
        </article>

        <article class="card">
            <img src="trees/samanea.jpg" alt="Samanea">
            <h3>Samanea</h3>
            <small>Samanea saman</small>
        </article>

        <article class="card">
            <img src="trees/agoho.jpg" alt="Agoho">
            <h3>Agoho</h3>
            <small>Casuarina equisetifolia</small>
        </article>

        <article class="card">
            <img src="trees/bayabas.jpg" alt="Guava">
            <h3>Guava</h3>
            <small>Psidium guajava L.</small>
        </article>

        <article class="card">
            <img src="trees/santol.jpg" alt="Santol">
            <h3>Santol</h3>
            <small>Sandoricum koetjape</small>
        </article>

        <article class="card">
            <img src="trees/mango.jpg" alt="Mango">
            <h3>Mango</h3>
            <small>Mangifera indica L.</small>
        </article>

        <article class="card">
            <img src="trees/kamias.jpg" alt="Kamias">
            <h3>Kamias</h3>
            <small>Averrhoa bilimbi</small>
        </article>
    </div>
</section>
