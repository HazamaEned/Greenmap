<div class="view-stack compact-view">
    <div class="panel-header">
        <div class="dashboard-title">
            <span id="report-detail-meta"></span>
            <h2 id="report-detail-title">Issue Report</h2>
        </div>
    </div>

    <div class="section-card">
        <h3>Details</h3>
        <p id="report-detail-content" style="white-space: pre-wrap; line-height: 1.6;"></p>
    </div>

    <div class="form-actions">
        <button type="button" id="close-report-details" class="secondary-action">Close</button>
        <button type="button" id="mark-report-unread">Mark as Unread</button>
        <button type="button" id="mark-report-read" class="primary-action">Mark as Read</button>
    </div>
</div>
