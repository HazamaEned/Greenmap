<section class="view-stack">
    <header class="panel-header dashboard-header">
        <div>
            <span>CENRO Operations</span>
            <h2>My Tree Reports</h2>
        </div>
        <button type="button" class="primary-action" id="add-contribution">+ Report a Tree</button>
    </header>

    <div id="contribution-form-region" class="contribution-form-region hidden" aria-live="polite"></div>

    <div class="contribution-summary" aria-label="Report summary">
        <article>
            <span>Total</span>
            <strong id="contribution-total">0</strong>
        </article>
        <article>
            <span>Pending</span>
            <strong id="contribution-pending">0</strong>
        </article>
        <article>
            <span>Approved</span>
            <strong id="contribution-approved">0</strong>
        </article>
        <article>
            <span>Denied</span>
            <strong id="contribution-rejected">0</strong>
        </article>
    </div>

    <div class="table-toolbar">
        <label class="field contribution-filter">
            Review status
            <select id="contribution-status-filter">
                <option value="">All statuses</option>
                <option value="Pending">Pending review</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Denied</option>
            </select>
        </label>
    </div>

    <div class="table-shell">
        <table class="table contribution-table">
            <thead>
                <tr>
                    <th>Action</th>
                    <th>Priority</th>
                    <th>Address / Location</th>
                    <th>Submitted</th>
                    <th>Review status</th>
                    <th>View</th>
                </tr>
            </thead>
            <tbody id="contributions-body">
                <tr><td colspan="6" class="empty-state">Loading your reports...</td></tr>
            </tbody>
        </table>
    </div>
</section>
