<section class="view-stack">
    <header class="panel-header">
        <span>Account</span>
        <h2>Settings</h2>
    </header>

    <div class="settings-split">
        <section class="section-card">
            <h3>Profile Information</h3>
            <form class="form-grid" id="profile-form">
                <label class="field">
                    Full Name
                    <input name="name" type="text" placeholder="Juan Dela Cruz" required>
                </label>

                <label class="field">
                    Email
                    <input name="email" type="email" placeholder="juan@email.com" required>
                </label>

                <label class="field">
                    Phone Number
                    <input name="phone" type="tel" placeholder="+63 900 123 4567">
                </label>

                <div class="divider"></div>

                <h3>Preferences</h3>

                <label class="switch field-inline">
                    <input name="emailNotifications" type="checkbox" checked>
                    <span class="slider"></span>
                    Email notifications
                </label>

                <label class="switch field-inline">
                    <input name="trackingAlerts" type="checkbox">
                    <span class="slider"></span>
                    Tracking alerts
                </label>

                <button type="submit" class="primary-action">Save Profile</button>
            </form>
        </section>

        <section class="section-card">
            <h3>Security</h3>

            <div class="form-grid">
                <label class="field">
                    Current Password
                    <input type="password">
                </label>

                <label class="field">
                    New Password
                    <input type="password">
                </label>

                <label class="field">
                    Confirm New Password
                    <input type="password">
                </label>
            </div>

            <button type="button" class="secondary-action requires-database">Update Password</button>
            <small class="database-note">Requires database and authentication setup.</small>

            <div class="divider"></div>

            <button type="button" class="danger-btn requires-database">Delete Account</button>
        </section>
    </div>
</section>
