<section class="view-stack compact-view">
    <header class="panel-header">
        <span>Inventory</span>
        <h2>Add Tree</h2>
    </header>

    <form class="form-box" id="add-tree-form">
        <label class="field">
            Common Name *
            <input name="name" type="text" placeholder="Mango Tree" maxlength="80" required>
        </label>

        <label class="field">
            Species Name *
            <input name="species" type="text" placeholder="Mangifera indica" maxlength="100" required>
        </label>

        <div class="field">
            <span>Location Coordinates *</span>
            <div class="coordinate-row">
                <input name="latitude" type="number" placeholder="Latitude" step="any" min="-90" max="90" required>
                <input name="longitude" type="number" placeholder="Longitude" step="any" min="-180" max="180" required>
            </div>
            <small>Map selection, manual entry, or <button type="button" id="use-location" class="link-button">use my location</button>.</small>
        </div>

        <label class="field">
            Date Planted *
            <input name="planted" type="month" required>
            <small>Estimated month is accepted.</small>
        </label>

        <label class="switch field-inline">
            <input name="active" type="checkbox" id="active-status" checked>
            <span class="slider"></span>
            Active
        </label>

        <button type="submit" class="primary-action">Add Tree</button>
    </form>
</section>
